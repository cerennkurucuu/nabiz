<!doctype html>
<html lang="tr">
  <head>

    <title>Dokunma hedefi test sayfası — küçük hedefler</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      .tiny {
        width: 16px;
        height: 16px;
        padding: 0;
        border: 1px solid #888888;
        background: #dddddd;
      }
      .small-link {
        display: inline-block;
        width: 20px;
        height: 18px;
        overflow: hidden;
        color: #0b3d91;
      }
      .tiny-text {
        font-size: 9px;
      }
    </style>
  </head>
  <body>
    <h1>Dokunma hedefi testi</h1>
    <div>
      <button class="tiny" aria-label="Küçük düğme"></button>
      <a class="small-link" href="/touch-targets">K</a>
      <a class="small-link" href="/touch-targets">L</a>
    </div>
    <p class="tiny-text">Bu metin 12 pikselin altındadır.</p>
  </body>
</html>
